[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-theater-monitor"
version = "0.1.0"
description = "Monitor newly listed showtimes at movie theaters."
requires-python = ">=3.13"
dependencies = [
  "boto3>=1.35",
  "pydantic>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
